<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Álbum de Fotos Virtual</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
        crossorigin="anonymous">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Estilos propios -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">

  <!-- ===== BARRA DE NAVEGACIÓN ===== -->
  <nav class="navbar navbar-dark bg-dark shadow-sm sticky-top">
    <div class="container-fluid px-4">
      <span class="navbar-brand fw-bold">
        <i class="bi bi-images me-2"></i>Álbum de Fotos Virtual
      </span>

      <div class="d-flex gap-2 align-items-center flex-wrap">

        <!-- Filtro por categoría -->
        <select id="filtroCategoria" class="form-select form-select-sm filtro-categoria" title="Filtrar por categoría">
          <option value="">Todas las categorías</option>
        </select>

        <!-- Botón para cargar fotos -->
        <button type="button" id="btnCargar" class="btn btn-primary btn-sm fw-semibold">
          <i class="bi bi-cloud-arrow-up me-1"></i> Cargar foto
        </button>
      </div>
    </div>
  </nav>

  <!-- ===== CONTENIDO PRINCIPAL ===== -->
  <main class="container py-4">

    <!-- Formulario de carga (oculto) -->
    <div id="zonaFormulario" class="card shadow-sm mb-4 d-none">
      <div class="card-body">
        <h5 class="card-title"><i class="bi bi-plus-circle me-2 text-primary"></i>Nueva foto</h5>

        <form id="formFoto" class="row g-3">
          <div class="col-md-6">
            <label for="inputFoto" class="form-label">Selecciona una imagen</label>
            <input type="file" class="form-control" id="inputFoto" accept="image/*">
          </div>

          <div class="col-md-4">
            <label for="selectCategoria" class="form-label">Categoría</label>
            <select class="form-select" id="selectCategoria"></select>
          </div>

          <div class="col-md-2 d-flex align-items-end gap-2">
            <button type="submit" class="btn btn-success w-100">
              <i class="bi bi-check-lg"></i> Guardar
            </button>
            <button type="button" id="btnCancelar" class="btn btn-outline-secondary">
              <i class="bi bi-x-lg"></i>
            </button>
          </div>
        </form>

        <!-- Vista previa -->
        <div id="vistaPrevia" class="mt-3 d-none">
          <p class="text-muted small mb-1">Vista previa:</p>
          <img id="imgPreview" src="" alt="Vista previa" class="border rounded preview-img">
        </div>
      </div>
    </div>

    <!-- Leyenda de colores por categoría -->
    <section class="mb-4">
      <h6 class="text-uppercase text-secondary fw-bold mb-2">Categorías</h6>
      <div id="leyendaCategorias" class="d-flex flex-wrap gap-2"></div>
    </section>

    <!-- Contador de fotos -->
    <p id="contador" class="text-secondary small"></p>

    <!-- Galería -->
    <div id="galeria" class="row g-4"></div>

    <!-- Mensaje cuando no hay fotos -->
    <div id="mensajeVacio" class="text-center py-5 text-secondary d-none">
      <i class="bi bi-image display-1 d-block mb-3"></i>
      <p class="fs-5">Aún no hay fotos en esta categoría.<br>Usa el botón <strong>“Cargar foto”</strong> para comenzar.</p>
    </div>
  </main>

  <!-- Modal para ver la foto en grande -->
  <div class="modal fade" id="modalFoto" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content border-0 bg-transparent">
        <div class="text-center">
          <img id="modalImg" src="" alt="" class="img-fluid rounded shadow-lg modal-img">
          <p id="modalInfo" class="mt-3 badge fs-6"></p>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
          crossorigin="anonymous"></script>

  <!-- Lógica de la aplicación -->
  <script src="app.js"></script>
</body>
</html>
